spring:
  config:
    import: optional:file:./system/.env[.properties],optional:file:./.env[.properties]

  application:
    name: garment-qc-system

  profiles:
    active: supabase

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  attendance:
    latitude: ${ATTENDANCE_LATITUDE}
    longitude: ${ATTENDANCE_LONGITUDE}
    radius-meter: 100
    max-gps-accuracy-meter: 50